name: Deploy to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: Upload site by SFTP
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
          TIMEWEB_PASSWORD: ${{ secrets.TIMEWEB_PASSWORD }}
          TIMEWEB_TARGET: ${{ secrets.TIMEWEB_TARGET }}
        run: |
          TARGET="${TIMEWEB_TARGET#/}"
          SSHPASS="$TIMEWEB_PASSWORD" sshpass -e rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            -e "ssh -p 22 -o StrictHostKeyChecking=accept-new" \
            ./ "$TIMEWEB_USER@$TIMEWEB_HOST:$TARGET"
