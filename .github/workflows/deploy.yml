name: Deploy to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload site by SFTP
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
          TIMEWEB_PASSWORD: ${{ secrets.TIMEWEB_PASSWORD }}
          TIMEWEB_TARGET: ${{ secrets.TIMEWEB_TARGET }}
        run: |
          lftp -u "$TIMEWEB_USER","$TIMEWEB_PASSWORD" "sftp://$TIMEWEB_HOST:22" -e "
            set sftp:auto-confirm yes
            mirror -R \
              --exclude-glob .git/** \
              --exclude-glob .github/** \
              --exclude README.md \
              ./ \"$TIMEWEB_TARGET\"
            bye
          "
